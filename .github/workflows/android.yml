
name: Build Pahari Go APK

'on':
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: unzip -o Pahari_Go_Full_MVP_Starter.zip -d extracted

      - name: Generate wrapper and build
        shell: bash
        run: |
          PROJECT_DIR="$(dirname "$(find extracted -name settings.gradle.kts -type f | head -n 1)")"
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "Android project root not found"
            find extracted -maxdepth 4 -type f
            exit 1
          fi
          cd "$PROJECT_DIR"
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Pahari-Go-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
